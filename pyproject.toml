[project]
name = "attention-relay"
version = "0.1.0.dev0"
description = "Instruction-aware text embeddings from instruction-agnostic embedding models, by relaying an LLM's attention. No training."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.4",
    "transformers>=5.17",
]

[dependency-groups]
reproduce = [
    "datasets>=3",
    "scikit-learn>=1.5",
    # k-means' results can change with the versions of NumPy and scikit-learn; these are the
    # versions the reproduction was checked with (on Python 3.12 and newer, where they install)
    "numpy==2.5.3; python_version >= '3.12'",
    "scikit-learn==1.9.1; python_version >= '3.12'",
    "scipy>=1.12",
    "threadpoolctl>=3",
    "matplotlib>=3.9",
]
modal = [
    "modal>=1",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "sentence-transformers>=5",
    { include-group = "reproduce" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attention_relay"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["N818"]  # an exception that stops a forward pass early is not an error

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
